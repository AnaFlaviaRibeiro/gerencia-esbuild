name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Run tests (coverage)
        run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
      - name: Build (dev)
        run: npm run build
      - name: Build (prod)
        run: npm run build:prod
      - name: Analyze bundle
        run: npm run analyze
      - name: Generate API docs
        run: npm run docs
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs
      - name: Upload api docs
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api
